<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clasificare recenzii filme</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #272b36;
    --text: #e8eaf0;
    --muted: #8a8f9c;
    --accent: #6c8cff;
    --pos: #3ddc97;
    --neg: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1e2b, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    background: #0f111a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    font-size: 0.95rem;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result {
    margin-top: 24px;
    padding: 18px;
    border-radius: 12px;
    display: none;
  }
  .result.show { display: block; }
  .result.pozitiv {
    background: rgba(61, 220, 151, 0.1);
    border: 1px solid rgba(61, 220, 151, 0.3);
  }
  .result.negativ {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
  }
  .result-label {
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result.pozitiv .result-label { color: var(--pos); }
  .result.negativ .result-label { color: var(--neg); }

  .bar-bg {
    margin-top: 12px;
    height: 8px;
    border-radius: 4px;
    background: #0f111a;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .result.pozitiv .bar-fill { background: var(--pos); }
  .result.negativ .bar-fill { background: var(--neg); }

  .prob-text {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .error {
    margin-top: 16px;
    color: var(--neg);
    font-size: 0.9rem;
    display: none;
  }
  .error.show { display: block; }

  .footer-note {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    line-height: 1.6;
  }
  .footer-note a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .footer-note a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Clasificare recenzii de filme</h1>
    <p class="sub">Scrie o recenzie și modelul îți spune dacă e pozitivă sau negativă.</p>

    <textarea id="reviewText" placeholder="Ex: This movie was absolutely fantastic, the acting was superb..."></textarea>
    <button id="submitBtn">Verifică sentimentul</button>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <div class="result-label" id="resultLabel"></div>
      <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
      <div class="prob-text" id="probText"></div>
    </div>

    <div class="footer-note">
      Model Logistic Regression antrenat pe 25.000 de recenzii IMDb &middot; acuratețe 90.47%
      <br />
      <a href="https://datastudio.google.com/reporting/f7a5b52f-ec1b-459c-bba9-fab0573201d1" target="_blank" rel="noopener">Vezi dashboard-ul complet →</a>
    </div>
  </div>

<script>
  // Pune aici URL-ul API-ului tau de pe Cloud Run
  const API_URL = "https://sentiment-api-299964848649.europe-west3.run.app/predict";

  const btn = document.getElementById("submitBtn");
  const textarea = document.getElementById("reviewText");
  const resultBox = document.getElementById("resultBox");
  const resultLabel = document.getElementById("resultLabel");
  const barFill = document.getElementById("barFill");
  const probText = document.getElementById("probText");
  const errorBox = document.getElementById("errorBox");

  async function checkSentiment() {
    const text = textarea.value.trim();
    errorBox.classList.remove("show");
    resultBox.classList.remove("show", "pozitiv", "negativ");

    if (!text) {
      errorBox.textContent = "Scrie o recenzie mai întâi.";
      errorBox.classList.add("show");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Se analizează...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      if (!res.ok) throw new Error("Eroare server: " + res.status);

      const data = await res.json();
      const sentiment = data.sentiment; // "pozitiv" sau "negativ"
      const prob = data.probability;    // probabilitatea de a fi pozitiv

      resultBox.classList.add("show", sentiment);
      resultLabel.textContent = sentiment === "pozitiv" ? "😊 Pozitiv" : "😞 Negativ";

      const displayProb = sentiment === "pozitiv" ? prob : 1 - prob;
      barFill.style.width = (displayProb * 100).toFixed(1) + "%";
      probText.textContent = `Încredere: ${(displayProb * 100).toFixed(1)}%`;

    } catch (err) {
      errorBox.textContent = "Nu am putut contacta API-ul. " + err.message;
      errorBox.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Verifică sentimentul";
    }
  }

  btn.addEventListener("click", checkSentiment);
  textarea.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) checkSentiment();
  });
</script>
</body>
</html>

</body></html>
